name: Image dimensions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/image-dimensions.yml'
permissions:
  contents: write
jobs:
  dimensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install Pillow
      - run: python3 scripts/optimize_image_dimensions.py
      - run: |
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet || git commit -m "Set intrinsic image dimensions from source assets"
          git push
