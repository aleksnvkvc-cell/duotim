name: Quality audit
on: [push, pull_request, workflow_dispatch]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test @axe-core/playwright lighthouse
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test scripts/quality-audit.spec.cjs --reporter=list
      - run: |
          python3 -m http.server 8766 &
          sleep 2
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npx lighthouse http://localhost:8766/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse-home.json
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())") npx lighthouse http://localhost:8766/kontakt.html --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse-contact.json
      - name: Summarize audit findings
        if: always()
        run: |
          node -e "const fs=require('fs'); for(const f of ['lighthouse-home.json','lighthouse-contact.json']) if(fs.existsSync(f)){const x=JSON.parse(fs.readFileSync(f)); console.log(f,JSON.stringify(Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,v.score]))));} if(fs.existsSync('axe-report.json')) console.log(fs.readFileSync('axe-report.json','utf8'));"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            lighthouse-*.json
            axe-report.json
